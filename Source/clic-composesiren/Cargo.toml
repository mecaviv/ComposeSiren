[package]
name = "clic-composesiren"
version = "0.1.0"
description = "ComposeSiren's click output: the click box's engine (firmwares-artila clic-rs), with a C ABI and a C++ wrapper"
edition = "2024"
rust-version = "1.85"
publish = false

# A standalone package inside ComposeSiren, not a member of any workspace.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# firmwares-artila is expected to be checked out next to ComposeSiren: the
# click box's engine (clicks, mixer, MIDI rule), without its ALSA output.
clic-rs = { path = "../../../firmwares-artila/ClicRaspberry/rs", default-features = false }

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
