# Generates include/clic_composesiren.h from src/ffi.rs (see build.rs).

language = "C"
style = "type"
cpp_compat = true
include_guard = "CLIC_COMPOSESIREN_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation = true
documentation_style = "c99"
line_length = 100
tab_width = 4

header = """
/*
 * clic-composesiren: C ABI of ComposeSiren's click output.
 *
 * Every function accepts a NULL handle and does nothing with it. The C++
 * wrapper clic_composesiren.hpp sits on top of it.
 */"""

autogen_warning = """
/* Generated by cbindgen from Source/clic-composesiren/src/ffi.rs when the crate
 * builds. Do not edit: change ffi.rs instead. */"""
