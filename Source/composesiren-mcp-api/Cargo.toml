[package]
name = "composesiren-mcp-api"
version = "0.1.0"
description = "What ComposeSiren's MCP server and its clients agree on: tool names, arguments, replies, the discovery file, and a small client"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace, like composesiren-mcp: CMake builds the crates one by one.
[workspace]

[features]
# schemars::JsonSchema on the argument types (the server derives its tool schemas from them).
schema = ["dep:schemars"]
# A blocking client of the server (plain HTTP on 127.0.0.1), from mcp-discovery.
client = ["mcp-discovery/client"]

# Public and small on purpose: ComposeSiren's MCP server is built by people
# who have none of the private repositories, so nothing here may depend on them.
[dependencies]
mcp-discovery = { path = "../mcp-discovery" }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
