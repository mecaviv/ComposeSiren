[package]
name = "composesiren-mcp"
version = "0.1.0"
description = "In-process MCP server for the ComposeSiren standalone and plugins"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The recording tools (start_recording, stop_recording, recording_status), for
# a plugin built with COMPOSESIREN_RECORD.
record = []

[dependencies]
# What the server and its clients agree on (public, same repository).
composesiren-mcp-api = { path = "../composesiren-mcp-api", features = ["schema"] }
# The discovery file, with its locking.
mcp-discovery = { path = "../mcp-discovery" }
axum = "0.8"
libc = "0.2"
rmcp = { version = "3.4", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
