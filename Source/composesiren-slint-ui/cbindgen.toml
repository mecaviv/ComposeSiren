language = "C"
style = "type"
cpp_compat = true
include_guard = "COMPOSESIREN_SLINT_UI_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]
documentation = true
documentation_style = "c99"
line_length = 100
tab_width = 4

header = """
/*
 * composesiren-slint-ui: C ABI of the Slint editor proof of concept. The JUCE
 * side is sketched in Source/Plugins/OneSiren/SlintOneSirenEditor.h.
 */"""

autogen_warning = """
/* Generated by cbindgen from Source/composesiren-slint-ui/src/ffi.rs when the
 * crate builds. Do not edit: change ffi.rs instead. */"""

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
