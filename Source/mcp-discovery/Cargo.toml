[package]
name = "mcp-discovery"
version = "0.1.0"
description = "How MCP servers of the mecaviv projects list themselves in a discovery file, and how clients find and talk to them"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace, like the other crates here: CMake builds them one by one.
[workspace]

[features]
# A blocking client of an MCP server (Streamable HTTP on 127.0.0.1).
client = ["dep:ureq"]

# Public and small on purpose: ComposeSiren's MCP server is built by people who have
# none of the private repositories, so nothing here may depend on them.
[dependencies]
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, optional = true }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
