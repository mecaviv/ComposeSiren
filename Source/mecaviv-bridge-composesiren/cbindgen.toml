# Generates include/mecaviv_bridge.h from src/ffi.rs (see build.rs).

language = "C"
style = "type"
cpp_compat = true
include_guard = "MECAVIV_BRIDGE_H"
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
documentation = true
documentation_style = "c99"
line_length = 100
tab_width = 4

header = """
/*
 * mecaviv-bridge-composesiren: C ABI of ComposeSiren's park bridge.
 *
 * Every function accepts a NULL handle and does nothing with it. Siren numbers
 * are 1..7; other numbers are ignored. The C++ wrapper mecaviv_bridge.hpp sits
 * on top of it.
 */"""

autogen_warning = """
/* Generated by cbindgen from Source/mecaviv-bridge-composesiren/src/ffi.rs when the crate
 * builds. Do not edit: change ffi.rs instead. */"""

[export]
include = ["mecaviv_st_state_t"]

[enum]
prefix_with_name = false
