<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SirenOrchestra — Clic UI mockup</title>
<style>
  :root {
    --bg: #283541;
    --cell-glass: rgba(255,255,255,0.13);
    --strip-grey: #314159;
    --strip-accent: #4650c8;
    --title-bar: #37474f;
    --reset: #8b0000;
    --orange: #ff9900;
    --knob-fill: #f5f5f5;
    --knob-black: #000000;
    --label: #ffffff;
    --group-label: rgba(255,255,255,0.85);
    --toggle-on: #32cd32;
    --s1: #295dd1; --s2: #1f6cd1; --s3: #4650c8; --s4: #3654ce;
    --s5: #177ccf; --s6: #0e8ece; --s7: #07a0cb;
    --vol1: #800000; --vol2: #ff0000; --vol3: #ff6600;
    --separator: #0000ff;
    --radius: 10px;
    --font-group: 700 12px/1.2 system-ui, -apple-system, Helvetica, sans-serif;
    --font-knob-label: 400 11.5px/1.2 system-ui, -apple-system, Helvetica, sans-serif;
    --font-value: 400 12px/1.2 system-ui, -apple-system, Helvetica, sans-serif;
    --font-title: 700 13px/1.15 system-ui, -apple-system, Helvetica, sans-serif;
    --font-engraved: 700 12px/1.1 system-ui, -apple-system, Helvetica, sans-serif;
    --font-vol: 400 10px/1 system-ui, -apple-system, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #1a2228;
    color: var(--label);
    font: var(--font-knob-label);
    min-height: 100%;
  }

  /* ── toolbar (mockup chrome, not the app) ─────────────────────────── */
  .mock-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    background: #11181e;
    border-bottom: 1px solid #2a3540;
    font: 400 13px/1.3 system-ui, sans-serif;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .mock-toolbar label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .mock-toolbar button {
    background: var(--title-bar);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
  }
  .mock-toolbar button:hover { filter: brightness(1.15); }
  .mock-toolbar button.primary { background: #2f6fed; }
  .mock-toolbar .hint { opacity: 0.65; font-size: 12px; }
  #layoutOut {
    flex: 1 1 220px;
    min-width: 180px;
    height: 32px;
    background: #0c1115;
    color: #9fd49f;
    border: 1px solid #2a3540;
    border-radius: 6px;
    font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 6px 8px;
  }

  /* ── app shell ────────────────────────────────────────────────────── */
  .app {
    width: 930px;
    margin: 18px auto 40px;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  .app-bg {
    background:
      linear-gradient(0deg, rgba(40,53,65,0.95), rgba(40,53,65,0.95)),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.015) 3px 4px);
  }

  .top-bar {
    height: 30px;
    background: #1e2830;
    display: flex;
    align-items: center;
    padding: 0 5px;
    gap: 8px;
  }
  .top-bar .options {
    background: var(--title-bar);
    color: #fff;
    border: 0;
    border-radius: 4px;
    height: 22px;
    padding: 0 10px;
    font: 400 12px/22px system-ui, sans-serif;
  }
  .top-bar .title {
    flex: 1;
    text-align: center;
    font: 400 14px/1 system-ui, sans-serif;
    color: #fff;
  }
  .top-bar .win-btns { display: flex; gap: 6px; }
  .top-bar .win-btn {
    width: 22px; height: 18px;
    border-radius: 3px;
    background: var(--title-bar);
  }
  .top-bar .win-btn.close { background: #8b1a1a; }

  .main-buttons {
    height: 30px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
  }
  .main-buttons button {
    border: 0;
    color: #f5f5f5;
    border-radius: 4px;
    height: 22px;
    padding: 0 12px;
    font: 400 12px/22px system-ui, sans-serif;
  }
  .main-buttons .reset { background: var(--reset); min-width: 70px; }
  .main-buttons .reset-all { background: var(--reset); min-width: 88px; }
  .main-buttons .menu { background: var(--title-bar); min-width: 64px; }

  /* siren rows (context only) */
  .siren-row {
    display: flex;
    height: 55px;
    margin: 2px 2px 0;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .siren-row.expanded { height: 100px; margin-top: 2px; }
  .siren-row .cells {
    flex: 1;
    display: flex;
    gap: 2px;
    padding: 3px;
    background: transparent;
  }
  .siren-row .cell-group {
    flex: 1;
    background: var(--cell-glass);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: space-around;
    min-width: 0;
  }
  .siren-row .cell-group .group-title {
    display: none;
  }
  .siren-row.expanded .cell-group {
    flex-direction: column;
    padding-top: 4px;
  }
  .siren-row.expanded .group-title {
    display: block;
    font: var(--font-group);
    color: var(--group-label);
  }
  .siren-row .mini-knob {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--knob-fill);
    box-shadow: 2px 2px 6px rgba(0,0,0,.45);
  }
  .siren-row .track-title {
    width: 70px;
    margin-left: 2px;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font: var(--font-title);
    text-align: center;
  }

  /* ── bottom band ──────────────────────────────────────────────────── */
  .bottom-band {
    position: relative;
    height: 158px;
    margin: 2px 2px 2px;
  }

  .panel {
    position: absolute;
    background: var(--strip-accent);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel .engraved {
    font: var(--font-engraved);
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 0 rgba(0,0,0,0.35);
    letter-spacing: 0.02em;
  }
  .panel .engraved-wrap {
    display: flex;
    align-items: center;
    height: 22px;
    padding: 0 8px;
    gap: 6px;
    justify-content: flex-start;
    position: relative;
  }
  .panel .engraved-underline {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1.5px;
    background: linear-gradient(90deg, rgba(255,255,255,0.45), rgba(255,255,255,0.3));
    border-radius: 1px;
  }

  /* header switch — white square, same for [ ] Reverb and [ ] Clic */
  .switch {
    width: 16px; height: 16px;
    border-radius: 3px;
    border: 1.5px solid var(--knob-fill);
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .switch.on {
    background: var(--knob-fill);
  }
  .switch.on::after {
    content: "";
    width: 8px; height: 8px;
    border-radius: 1px;
    background: #1a1a1a;
  }
  .switch-label {
    font: 400 11px/1 system-ui, sans-serif;
    color: #f5f5f5;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  /* header gap under engraved title so Decay is not tight against "Clic" */
  #clicPane .engraved-wrap {
    height: 26px;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  #clicPane .engraved-underline {
    bottom: 4px;
  }

  /* cells / knobs */
  .knob-cell {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }
  .knob-cell .klabel {
    font: var(--font-knob-label);
    color: var(--label);
    text-align: center;
    width: 100%;
    flex: 0 0 auto;
    white-space: nowrap;
    overflow: hidden;
  }
  .knob-cell .kbox {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  .knob {
    position: relative;
    border-radius: 50%;
    background: var(--knob-fill);
    box-shadow:
      3px 2px 10px rgba(0,0,0,0.55),
      inset 0 -2px 0 rgba(0,0,0,0.08);
    cursor: ns-resize;
  }
  .knob.black {
    background: #000;
    border: 1.5px solid #d3d3d3;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.65);
  }
  .knob .thumb {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 42%;
    height: 4px;
    background: rgba(0,0,0,0.6);
    border-radius: 2px;
    transform-origin: center center;
    transform: translate(-50%, -50%) rotate(var(--angle, 0deg)) translateY(-28%);
  }
  .knob.black .thumb {
    width: 7px; height: 7px;
    border-radius: 2px;
    background: rgba(255,255,255,0.6);
    transform: translate(-50%, -50%) rotate(var(--angle, 0deg)) translateY(-42%);
  }
  .knob .arc {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    pointer-events: none;
  }

  /* Reverb cells */
  .reverb-body {
    position: absolute;
    left: 6px; right: 6px; top: 24px; bottom: 6px;
    display: flex;
    gap: 2px;
  }
  .rev-group {
    background: var(--cell-glass);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    position: relative;
  }
  .rev-group.enable-grp { flex: 1.2; }
  .rev-group.rev-grp { flex: 4; }
  .rev-group.filt-grp { flex: 2; }
  .rev-group .knob-cell {
    position: relative;
    width: 44px;
    height: 100%;
  }

  /* Clic pane — design target */
  #clicPane {
    background: var(--strip-accent);
  }
  #clicPane.dimmed .klabel { opacity: 0.55; }
  #clicPane.dimmed .knob:not(.black) { opacity: 0.7; }

  .clic-stage {
    position: absolute;
    left: 0; right: 0; top: 24px; bottom: 4px;
  }

  /* ring around Vol */
  #ringPad {
    position: absolute;
    border-radius: 50%;
    cursor: grab;
    z-index: 5;
    touch-action: none;
  }
  #ringPad:active { cursor: grabbing; }
  #ringCanvas {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  /* Master */
  .master-body {
    position: absolute;
    inset: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .master-body .knob-cell { width: 120px; height: 145px; }

  /* Keyboard stub */
  #keyboard {
    background: #1a2228;
    overflow: hidden;
    padding: 2px;
  }
  .kb-pitches {
    height: 12px;
    background: var(--knob-fill);
    border-radius: 2px;
    position: relative;
    margin-bottom: 2px;
  }
  .kb-pitches .dot {
    position: absolute;
    top: 50%;
    width: 7px; height: 7px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.9;
  }
  .kb-keys {
    height: 40px;
    display: flex;
    background: #fff;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .kb-keys .wk {
    flex: 1;
    border-right: 1px solid #ccc;
    background: #fff;
  }
  .kb-keys .bk {
    position: absolute;
    top: 0;
    width: 2.2%;
    height: 55%;
    background: #333;
    z-index: 1;
  }
  .kb-vol {
    height: 17px;
    margin-top: 2px;
    display: flex;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .kb-vol .v {
    display: flex;
    align-items: center;
    justify-content: center;
    font: var(--font-vol);
    color: #f5f5f5;
    text-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  .kb-vol .v1 { width: 28%; background: var(--vol1); }
  .kb-vol .v2 { width: 36%; background: var(--vol2); }
  .kb-vol .v3 { width: 36%; background: var(--vol3); }
  .kb-vol .sep {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--separator);
    transform: skewX(-12deg);
  }

  /* edit handles */
  body.edit-on [data-edit] {
    outline: 1px dashed rgba(0,255,255,0.35);
  }
  body.edit-on [data-edit]:hover {
    outline: 1px solid rgba(0,255,255,0.8);
  }
  body.edit-on [data-edit].editing {
    outline: 2px solid #0ff;
    z-index: 20;
  }
  .rs-handle {
    display: none;
    position: absolute;
    right: -4px; bottom: -4px;
    width: 10px; height: 10px;
    background: #0ff;
    border: 1px solid #003;
    border-radius: 2px;
    cursor: nwse-resize;
    z-index: 30;
  }
  body.edit-on .rs-handle { display: block; }

  #coordTip {
    position: fixed;
    pointer-events: none;
    background: rgba(0,0,0,0.85);
    color: #9fffcf;
    font: 11px/1.3 ui-monospace, Menlo, monospace;
    padding: 4px 7px;
    border-radius: 4px;
    z-index: 100;
    display: none;
    white-space: pre;
  }

  .eff-meter {
    position: absolute;
    left: 8px; bottom: 6px;
    font: 10px/1.2 ui-monospace, monospace;
    color: rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.35);
    padding: 3px 6px;
    border-radius: 4px;
    z-index: 6;
    pointer-events: none;
  }

  .pulse-note {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    vertical-align: middle;
    margin-right: 4px;
  }
  .pulse-note.fort { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
  .pulse-note.faible { background: #7ec8ff; box-shadow: 0 0 8px #7ec8ff; }
</style>
</head>
<body class="edit-on">

<div class="mock-toolbar">
  <strong style="margin-right:4px">Clic UI mockup</strong>
  <label><input type="checkbox" id="tglEdit" checked /> Edit (drag / resize)</label>
  <label><input type="checkbox" id="tglSecondary" checked disabled /> Spread/Bias knobs</label>
  <label><input type="checkbox" id="tglDensify" /> Densified reverb</label>
  <label><input type="checkbox" id="tglPlay" /> Play clic loop (visual)</label>
  <button id="btnReset">Reset layout</button>
  <button id="btnCopy" class="primary">Copy layout JSON</button>
  <span class="hint">Enable is an override — does not write Vol</span>
  <input id="layoutOut" readonly placeholder="layout JSON…" />
</div>

<div class="app">
  <div class="app-bg">

    <div class="top-bar">
      <button class="options">Options</button>
      <div class="title">SirenOrchestra</div>
      <div class="win-btns">
        <div class="win-btn min"></div>
        <div class="win-btn close"></div>
      </div>
    </div>

    <div class="main-buttons">
      <button class="reset-all">Reset All</button>
      <button class="reset">Reset</button>
      <button class="menu">Menu</button>
    </div>

    <!-- siren context rows -->
    <div id="sirenRows"></div>

    <!-- BOTTOM BAND -->
    <div class="bottom-band" id="bottomBand">

      <!-- Reverb -->
      <div class="panel" id="reverbPanel" data-edit
           style="left:2px; top:0; width:653px; height:83px;">
        <div class="engraved-wrap">
          <div class="switch on" id="reverbEnable" title="Reverb enable"></div>
          <span class="engraved">Reverb</span>
          <div class="engraved-underline"></div>
        </div>
        <div class="reverb-body" id="reverbBody">
          <div class="rev-group enable-grp">
            <div class="knob-cell" data-edit data-role="reverb.enable" style="width:56px">
              <div class="klabel">Enable<br/>Reverb</div>
              <div class="kbox"><div class="knob" data-knob data-param="reverbEnable" data-kind="toggle" style="width:28px;height:28px"></div></div>
              <div class="rs-handle"></div>
            </div>
          </div>
          <div class="rev-group rev-grp" id="revGrp"></div>
          <div class="rev-group filt-grp" id="filtGrp"></div>
        </div>
        <div class="rs-handle"></div>
      </div>

      <!-- Clic pane (design target) -->
      <div class="panel" id="clicPane" data-edit
           style="left:662px; top:1px; width:136px; height:158px;">
        <!-- Same header as Reverb: [ ] Clic + underline -->
        <div class="engraved-wrap">
          <div class="switch on" id="clicEnable"
               title="Clic master override — off forces volume 0 (does not write Vol)"></div>
          <span class="engraved">Clic</span>
          <div class="engraved-underline"></div>
        </div>

        <div class="clic-stage" id="clicStage">
          <!-- ring removed — pan is Spread/Bias knobs (no ring, no yoke rail) -->
          <div id="ringPad" data-edit data-role="clic.ring" style="display:none;"
               style="left:18px; top:36px; width:100px; height:100px;">
            <canvas id="ringCanvas" width="208" height="208"></canvas>
            <div class="rs-handle"></div>
          </div>

          <div class="knob-cell" id="volCell" data-edit data-role="clic.vol"
               style="left:36px; top:64px; width:64px; height:64px; z-index:8;">
            <div class="kbox" style="position:absolute; inset:0 0 14px 0;">
              <div class="knob black" data-knob data-param="vol" data-kind="rot"
                   style="width:56px;height:56px">
                <div class="thumb"></div>
              </div>
            </div>
            <div class="klabel" style="position:absolute; bottom:0; left:0; right:0; height:14px; line-height:14px; pointer-events:none;">Vol</div>
            <div class="rs-handle"></div>
          </div>

          <!-- Decay top -->
          <div class="knob-cell" id="decayCell" data-edit data-role="clic.decay"
               style="left:48px; top:0; width:44px; height:52px;">
            <div class="klabel">Decay</div>
            <div class="kbox">
              <div class="knob" data-knob data-param="decay" data-kind="rot"
                   style="width:34px;height:34px">
                <div class="thumb"></div>
              </div>
            </div>
            <div class="rs-handle"></div>
          </div>

          <!-- Spread / Bias knobs (user layout — always present) -->
          <div class="knob-cell sec-knob" id="spreadCell" data-edit data-role="clic.spread"
               style="left:2px; top:20px; width:34px; height:44px;">
            <div class="klabel">Spread</div>
            <div class="kbox">
              <div class="knob" data-knob data-param="spread" data-kind="bipolar"
                   style="width:28px;height:28px">
                <div class="thumb"></div>
              </div>
            </div>
            <div class="rs-handle"></div>
          </div>
          <div class="knob-cell sec-knob" id="biasCell" data-edit data-role="clic.bias"
               style="left:96px; top:20px; width:34px; height:44px;">
            <div class="klabel">Bias</div>
            <div class="kbox">
              <div class="knob" data-knob data-param="bias" data-kind="bipolar"
                   style="width:28px;height:28px">
                <div class="thumb"></div>
              </div>
            </div>
            <div class="rs-handle"></div>
          </div>
        </div>

        <div class="eff-meter" id="effMeter">eff 1.00 · ring on</div>
        <div class="rs-handle"></div>
      </div>

      <!-- Master Volume (no clic controls) -->
      <div class="panel" id="masterPanel" data-edit
           style="left:804px; top:1px; width:119px; height:157px;">
        <div class="engraved-wrap">
          <span class="engraved">Master Volume</span>
          <div class="engraved-underline"></div>
        </div>
        <div class="master-body">
          <div class="knob-cell" data-edit data-role="master.vol" style="width:120px;height:130px">
            <div class="klabel" style="visibility:hidden">·</div>
            <div class="kbox">
              <div class="knob black" data-knob data-param="master" data-kind="rot"
                   style="width:88px;height:88px">
                <div class="thumb"></div>
              </div>
            </div>
            <div class="rs-handle"></div>
          </div>
        </div>
        <div class="rs-handle"></div>
      </div>

      <!-- Keyboard under reverb + (into clic height) -->
      <div class="panel" id="keyboard" data-edit
           style="left:2px; top:88px; width:653px; height:68px; background:#1a2228;">
        <div class="kb-pitches" id="kbPitches"></div>
        <div class="kb-keys" id="kbKeys"></div>
        <div class="kb-vol" id="kbVol">
          <div class="v v1">VOL 1</div>
          <div class="v v2">VOL 2</div>
          <div class="v v3">VOL 3</div>
          <div class="sep" style="left:28%"></div>
          <div class="sep" style="left:64%"></div>
          <div class="sep" style="left:40%"></div>
          <div class="sep" style="left:78%"></div>
        </div>
        <div class="rs-handle"></div>
      </div>

    </div>
  </div>
</div>

<div id="coordTip"></div>

<script>
(function () {
  "use strict";

  // ── state ──────────────────────────────────────────────────────────
  // ClicEnable is an OVERRIDE. It does not write ClicVolume.
  const state = {
    clicEnable: true,
    reverbEnable: true,
    vol: 0.85,        // ClicVolume 0..1
    decay: 1.0,       // ClicDecay 0..1
    spread: -0.35,    // ClicSpread -1..1
    bias: 0.55,       // ClicBias -1..1
    master: 0.9,
    showSecondary: false,
    densify: false,
    play: false,
  };

  const DEFAULT_LAYOUT = null; // filled from live DOM on first run
  let defaultLayout = null;

  const params = {
    vol:     { min: 0,  max: 1,  bipolar: false },
    decay:   { min: 0,  max: 1,  bipolar: false },
    spread:  { min: -1, max: 1,  bipolar: true },
    bias:    { min: -1, max: 1,  bipolar: true },
    master:  { min: 0,  max: 1,  bipolar: false },
    reverbEnable: { min: 0, max: 1, bipolar: false },
  };

  // ── effective volume ───────────────────────────────────────────────
  function effVol() {
    return state.clicEnable ? state.vol : 0;
  }

  // ── siren rows ─────────────────────────────────────────────────────
  const sirenColours = {
    S7: "var(--s7)", S6: "var(--s6)", S5: "var(--s5)",
    S2: "var(--s2)", S1: "var(--s1)", S4: "var(--s4)", S3: "var(--s3)",
  };
  const sirenOrder = [
    ["S7", "Piccolo\\nch7"],
    ["S6", "Soprano 2\\nch6"],
    ["S5", "Soprano 1\\nch5"],
    ["S2", "Alto 2\\nch2"],
    ["S1", "Alto 1\\nch1"],
    ["S4", "Tenor\\nch4"],
    ["S3", "Bass\\nch3"],
  ];

  function buildSirenRows() {
    const host = document.getElementById("sirenRows");
    const groupsTop = ["Pitch", "Vibrato", "Tremolo", "Envelope", "Timbre", "Master"];
    sirenOrder.forEach((row, i) => {
      const [id, title] = row;
      const el = document.createElement("div");
      el.className = "siren-row" + (i === 0 ? " expanded" : "");
      const cells = document.createElement("div");
      cells.className = "cells";
      groupsTop.forEach((g) => {
        const grp = document.createElement("div");
        grp.className = "cell-group";
        if (i === 0) {
          const t = document.createElement("div");
          t.className = "group-title";
          t.textContent = g;
          grp.appendChild(t);
        }
        const n = g === "Pitch" ? 3 : g === "Master" ? 2 : 2;
        for (let k = 0; k < n; k++) {
          const kn = document.createElement("div");
          kn.className = "mini-knob";
          grp.appendChild(kn);
        }
        cells.appendChild(grp);
      });
      const tt = document.createElement("div");
      tt.className = "track-title";
      tt.style.background = sirenColours[id];
      tt.innerHTML = title.split("\\n").join("<br/>");
      tt.style.fontSize = i === 0 ? "13px" : "11px";
      el.appendChild(cells);
      el.appendChild(tt);
      host.appendChild(el);
    });
  }

  // ── reverb knobs ───────────────────────────────────────────────────
  function knobCell(role, label, param, kind, w) {
    const cell = document.createElement("div");
    cell.className = "knob-cell";
    cell.dataset.edit = "";
    cell.dataset.role = role;
    cell.style.width = w + "px";
    cell.innerHTML =
      '<div class="klabel">' + label + "</div>" +
      '<div class="kbox"><div class="knob" data-knob data-param="' + param +
      '" data-kind="' + kind + '" style="width:' + Math.min(w - 8, 36) + "px;height:" +
      Math.min(w - 8, 36) + 'px"><div class="thumb"></div></div></div>' +
      '<div class="rs-handle"></div>';
    return cell;
  }

  function buildReverb() {
    const rev = document.getElementById("revGrp");
    const filt = document.getElementById("filtGrp");
    rev.innerHTML = "";
    filt.innerHTML = "";
    [
      ["reverb.drywet", "DryWet", "reverbDryWet", "rot"],
      ["reverb.damp", "Damp", "reverbDamp", "rot"],
      ["reverb.size", "Size", "reverbSize", "rot"],
      ["reverb.width", "Width", "reverbWidth", "rot"],
    ].forEach((r) => rev.appendChild(knobCell(r[0], r[1], r[2], r[3], 42)));
    [
      ["reverb.lowcut", "LowCut", "reverbLow", "rot"],
      ["reverb.highcut", "HighCut", "reverbHigh", "rot"],
    ].forEach((r) => filt.appendChild(knobCell(r[0], r[1], r[2], r[3], 42)));

    // fake values for reverb knobs (not in state)
    document.querySelectorAll("#reverbPanel [data-knob]").forEach((el) => {
      if (!el.dataset.param.startsWith("reverb") || el.dataset.param === "reverbEnable") return;
      el._v = 0.4 + Math.random() * 0.5;
    });
  }

  // ── keyboard ───────────────────────────────────────────────────────
  function buildKeyboard() {
    const pitches = document.getElementById("kbPitches");
    pitches.innerHTML = "";
    [0.08, 0.18, 0.3, 0.45, 0.58, 0.72, 0.88].forEach((p, i) => {
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = p * 100 + "%";
      d.style.background = sirenColours[sirenOrder[i][0]];
      d.style.boxShadow = "0 0 0 1px rgba(255,255,255,0.35)";
      pitches.appendChild(d);
    });
    const keys = document.getElementById("kbKeys");
    keys.innerHTML = "";
    for (let i = 0; i < 42; i++) {
      const w = document.createElement("div");
      w.className = "wk";
      keys.appendChild(w);
    }
    // black keys roughly
    const blackPat = [0, 1, 3, 4, 5]; // scale degrees
    for (let oct = 0; oct < 6; oct++) {
      blackPat.forEach((deg) => {
        const idx = oct * 7 + deg;
        if (idx >= 41) return;
        const bk = document.createElement("div");
        bk.className = "bk";
        bk.style.left = ((idx + 1) / 42) * 100 + "%";
        keys.appendChild(bk);
      });
    }
  }

  // ── knob paint / value ─────────────────────────────────────────────
  function setKnobVisual(el, value, bipolar) {
    const p = params[el.dataset.param] || { min: 0, max: 1, bipolar: !!bipolar };
    const t = (value - p.min) / (p.max - p.min);
    // -135deg .. +135deg
    const angle = -135 + t * 270;
    el.style.setProperty("--angle", angle + "deg");
    const thumb = el.querySelector(".thumb");
    if (thumb) thumb.style.transform =
      "translate(-50%, -50%) rotate(" + angle + "deg) translateY(" +
      (el.classList.contains("black") ? "-42%" : "-28%") + ")";
    el._v = value;
  }

  function syncKnobs() {
    document.querySelectorAll("[data-knob]").forEach((el) => {
      const key = el.dataset.param;
      if (key === "vol") setKnobVisual(el, state.vol, false);
      else if (key === "decay") setKnobVisual(el, state.decay, false);
      else if (key === "spread") setKnobVisual(el, state.spread, true);
      else if (key === "bias") setKnobVisual(el, state.bias, true);
      else if (key === "master") setKnobVisual(el, state.master, false);
      else if (key === "reverbEnable") {
        el._v = state.reverbEnable ? 1 : 0;
        el.style.background = state.reverbEnable ? "#f5f5f5" : "#666";
      } else if (el._v != null) {
        setKnobVisual(el, el._v, false);
      }
    });
  }

  // ── ring ───────────────────────────────────────────────────────────
  const ringPad = document.getElementById("ringPad");
  const ringCanvas = document.getElementById("ringCanvas");
  const rctx = ringCanvas.getContext("2d");

  function drawRing() {
    const v = effVol();
    const w = ringPad.clientWidth;
    const h = ringPad.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    if (ringCanvas.width !== w * dpr) {
      ringCanvas.width = w * dpr;
      ringCanvas.height = h * dpr;
    }
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rctx.clearRect(0, 0, w, h);

    const meter = document.getElementById("effMeter");
    document.getElementById("clicPane").classList.toggle("dimmed", !state.clicEnable);
    meter.textContent = "eff " + v.toFixed(2) +
      " · ring " + (v <= 0.001 ? "off" : "on") +
      (state.clicEnable ? "" : " (override off)");

    if (v <= 0.001) return; // invisible at effective volume 0

    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 2;
    const thick = 1.5 + v * 6;

    rctx.beginPath();
    rctx.arc(cx, cy, r, 0, Math.PI * 2);
    rctx.strokeStyle = "rgba(255,255,255,0.12)";
    rctx.lineWidth = thick;
    rctx.stroke();

    // indicator: bias = x, spread = y
    const ix = cx + state.bias * r * 0.85;
    const iy = cy - state.spread * r * 0.85;
    const ia = 0.35 + 0.45 * v;
    rctx.beginPath();
    rctx.arc(ix, iy, 4, 0, Math.PI * 2);
    rctx.fillStyle = "rgba(0,255,255," + ia + ")";
    rctx.fill();
    rctx.strokeStyle = "rgba(255,255,255,0.5)";
    rctx.lineWidth = 1.2;
    rctx.stroke();
  }

  function ringDrag(e) {
    if (!state.clicEnable) return; // override off: pan still settable? allow — only gain is gated
    const rect = ringPad.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 2;
    let bx = (e.clientX - rect.left - cx) / r;
    let sy = -(e.clientY - rect.top - cy) / r;
    bx = Math.max(-1, Math.min(1, bx));
    sy = Math.max(-1, Math.min(1, sy));
    state.bias = bx;
    state.spread = sy;
    syncKnobs();
    drawRing();
  }

  // ring drag always works (spread/bias are independent of enable);
  // enable only gates effective volume / ring visibility / audio gain.
  ringPad.addEventListener("pointerdown", (e) => {
    if (document.body.classList.contains("edit-on") && e.target.classList.contains("rs-handle")) return;
    ringPad.setPointerCapture(e.pointerId);
    ringDrag(e);
  });
  ringPad.addEventListener("pointermove", (e) => {
    if (e.buttons) ringDrag(e);
  });

  // ── enable switches ────────────────────────────────────────────────
  const clicEnableEl = document.getElementById("clicEnable");
  clicEnableEl.addEventListener("click", (e) => {
    // ignore when starting a resize/edit drag on the handle
    if (e.target.classList.contains("rs-handle")) return;
    state.clicEnable = !state.clicEnable;
    clicEnableEl.classList.toggle("on", state.clicEnable);
    // MUST NOT write state.vol
    syncKnobs();
    drawRing();
  });

  const reverbEnableEl = document.getElementById("reverbEnable");
  reverbEnableEl.addEventListener("click", () => {
    state.reverbEnable = !state.reverbEnable;
    reverbEnableEl.classList.toggle("on", state.reverbEnable);
    syncKnobs();
  });

  // ── knob drag (vertical) ───────────────────────────────────────────
  function bindKnobs() {
    document.querySelectorAll("[data-knob]").forEach((el) => {
      el.addEventListener("pointerdown", (e) => {
        if (document.body.classList.contains("edit-on") && e.altKey) {
          // Alt+drag = move in edit mode (handled by drag layer)
          return;
        }
        e.stopPropagation();
        el.setPointerCapture(e.pointerId);
        const key = el.dataset.param;
        const startY = e.clientY;
        const startV = el._v != null ? el._v : 0;
        const p = params[key] || { min: 0, max: 1 };
        const range = p.max - p.min;
        el._dragging = true;

        function move(ev) {
          const dy = startY - ev.clientY;
          let v = startV + (dy / 140) * range;
          v = Math.max(p.min, Math.min(p.max, v));
          if (key === "vol") state.vol = v;
          else if (key === "decay") state.decay = v;
          else if (key === "spread") state.spread = v;
          else if (key === "bias") state.bias = v;
          else if (key === "master") state.master = v;
          else if (key === "reverbEnable") state.reverbEnable = v > 0.5;
          else el._v = v;
          syncKnobs();
          drawRing();
        }
        function up(ev) {
          el._dragging = false;
          el.releasePointerCapture(e.pointerId);
          el.removeEventListener("pointermove", move);
          el.removeEventListener("pointerup", up);
        }
        el.addEventListener("pointermove", move);
        el.addEventListener("pointerup", up);
        move(e);
      });
    });
  }

  // ── edit mode: drag & resize panels / cells ────────────────────────
  const tip = document.getElementById("coordTip");

  function showTip(e, text) {
    tip.style.display = "block";
    tip.style.left = e.clientX + 14 + "px";
    tip.style.top = e.clientY + 14 + "px";
    tip.textContent = text;
  }
  function hideTip() { tip.style.display = "none"; }

  function parsePx(el, prop) {
    return parseFloat(getComputedStyle(el)[prop]) || 0;
  }

  function beginMove(el, e, mode) {
    // mode: "move" | "resize"
    e.preventDefault();
    e.stopPropagation();
    el.classList.add("editing");
    const start = {
      x: e.clientX, y: e.clientY,
      left: parsePx(el, "left"),
      top: parsePx(el, "top"),
      w: el.offsetWidth,
      h: el.offsetHeight,
    };
    const isAbs = getComputedStyle(el).position === "absolute";
    // for flex children (reverb knobs) use transform offset instead
    if (!isAbs) {
      el.style.position = "relative";
      el.style.left = "0px";
      el.style.top = "0px";
    }

    function move(ev) {
      const dx = ev.clientX - start.x;
      const dy = ev.clientY - start.y;
      if (mode === "move") {
        el.style.left = Math.round(start.left + dx) + "px";
        el.style.top = Math.round(start.top + dy) + "px";
      } else {
        el.style.width = Math.max(16, Math.round(start.w + dx)) + "px";
        el.style.height = Math.max(16, Math.round(start.h + dy)) + "px";
      }
      showTip(ev, el.dataset.role + "\n" +
        "x " + Math.round(parsePx(el, "left")) +
        "  y " + Math.round(parsePx(el, "top")) +
        "\nw " + el.offsetWidth + "  h " + el.offsetHeight);
    }
    function up(ev) {
      el.classList.remove("editing");
      hideTip();
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    move(e);
  }

  function bindEdit() {
    document.querySelectorAll("[data-edit]").forEach((el) => {
      el.addEventListener("pointerdown", (e) => {
        if (!document.body.classList.contains("edit-on")) return;
        if (e.target.closest("[data-knob]") && !e.target.classList.contains("rs-handle") && !e.altKey) {
          return; // knob drag wins unless alt
        }
        if (e.target.classList.contains("rs-handle")) {
          beginMove(el, e, "resize");
          return;
        }
        // Header switch: click toggles; Alt+drag moves
        if (el.classList.contains("switch") && !e.altKey) {
          return;
        }
        if (e.altKey || !e.target.closest("[data-knob]")) {
          // move the nearest data-edit ancestor if clicking child
          const target = e.target.closest("[data-edit]") || el;
          beginMove(target, e, "move");
        }
      });
    });

    // label drag: move with the cell; double-click = edit text
    document.querySelectorAll(".klabel, .engraved").forEach((lab) => {
      lab.addEventListener("dblclick", (e) => {
        if (!document.body.classList.contains("edit-on")) return;
        e.stopPropagation();
        const prev = lab.innerHTML;
        lab.contentEditable = "true";
        lab.focus();
        function done() {
          lab.contentEditable = "false";
          lab.removeEventListener("blur", done);
        }
        lab.addEventListener("blur", done);
      });
    });
  }

  // ── layout export ──────────────────────────────────────────────────
  function collectLayout() {
    const out = {
      clicBorrow: Math.round(document.getElementById("clicPane").offsetWidth),
      bandHeight: Math.round(document.getElementById("bottomBand").offsetHeight),
      controls: {},
    };
    document.querySelectorAll("[data-edit]").forEach((el) => {
      const role = el.dataset.role || el.id || el.className;
      out.controls[role] = {
        x: Math.round(parsePx(el, "left")),
        y: Math.round(parsePx(el, "top")),
        w: el.offsetWidth,
        h: el.offsetHeight,
      };
    });
    out.params = {
      clicEnable: state.clicEnable,
      vol: +state.vol.toFixed(3),
      decay: +state.decay.toFixed(3),
      spread: +state.spread.toFixed(3),
      bias: +state.bias.toFixed(3),
    };
    out.effectiveVolume = +effVol().toFixed(3);
    out.ringVisible = effVol() > 0.001;
    return out;
  }

  function snapshotLayout() {
    defaultLayout = collectLayout();
    document.getElementById("layoutOut").value = "layout captured — click Copy to export";
  }

  function resetLayout() {
    // reload page positions from default snapshot
    if (!defaultLayout) return;
    Object.entries(defaultLayout.controls).forEach(([role, box]) => {
      const el = document.querySelector('[data-role="' + role + '"]') ||
                 (role === "clicPane" ? document.getElementById("clicPane") : null);
      if (!el) return;
      el.style.left = box.x + "px";
      el.style.top = box.y + "px";
      el.style.width = box.w + "px";
      el.style.height = box.h + "px";
    });
  }

  document.getElementById("btnCopy").addEventListener("click", async () => {
    const json = JSON.stringify(collectLayout(), null, 2);
    document.getElementById("layoutOut").value = json;
    try { await navigator.clipboard.writeText(json); } catch (_) {}
  });
  document.getElementById("btnReset").addEventListener("click", resetLayout);

  // ── toolbar toggles ────────────────────────────────────────────────
  document.getElementById("tglEdit").addEventListener("change", (e) => {
    document.body.classList.toggle("edit-on", e.target.checked);
  });
  document.getElementById("tglSecondary").addEventListener("change", (e) => {
    // Spread/Bias knobs are always on in this layout; toggle kept as no-op for older sessions
    state.showSecondary = true;
    document.querySelectorAll(".sec-knob").forEach((el) => {
      el.style.display = "flex";
    });
  });
  document.getElementById("tglDensify").addEventListener("change", (e) => {
    state.densify = e.target.checked;
    const cells = document.querySelectorAll("#reverbPanel .knob-cell");
    cells.forEach((c) => {
      const kn = c.querySelector(".knob");
      const s = e.target.checked ? 28 : 36;
      if (kn && !c.dataset.role.includes("enable")) {
        kn.style.width = s + "px";
        kn.style.height = s + "px";
      }
    });
  });
  document.getElementById("tglPlay").addEventListener("change", (e) => {
    state.play = e.target.checked;
    if (state.play) startLoop(); else stopLoop();
  });

  // ── visual clic loop (fort / faible pulses) ─────────────────────────
  let loopTimer = null;
  let tickN = 0;
  function startLoop() {
    stopLoop();
    loopTimer = setInterval(() => {
      const fort = tickN % 2 === 0;
      tickN++;
      const v = effVol();
      if (v <= 0.001) return;
      // flash the ring indicator intensity via temporary scale
      const pad = ringPad;
      pad.style.filter = "brightness(" + (1 + v * 0.5) + ")";
      setTimeout(() => { pad.style.filter = ""; }, 80);
      const meter = document.getElementById("effMeter");
      meter.innerHTML =
        '<span class="pulse-note ' + (fort ? "fort" : "faible") + '"></span>' +
        (fort ? "fort" : "faible") +
        " · eff " + v.toFixed(2) +
        " · pan " + state.bias.toFixed(2) + "/" + state.spread.toFixed(2);
    }, 450);
  }
  function stopLoop() {
    if (loopTimer) clearInterval(loopTimer);
    loopTimer = null;
  }

  // ── init ───────────────────────────────────────────────────────────
  buildSirenRows();
  buildReverb();
  buildKeyboard();
  bindKnobs();
  bindEdit();
  // ensure override switches match state on load (Clic ON = Vol applies)
  clicEnableEl.classList.toggle("on", state.clicEnable);
  reverbEnableEl.classList.toggle("on", state.reverbEnable);
  syncKnobs();
  drawRing();
  // capture default layout after paint
  requestAnimationFrame(() => {
    // clear inline positions that we didn't set, then snapshot
    snapshotLayout();
    document.getElementById("layoutOut").placeholder = "Click Copy layout JSON";
    document.getElementById("layoutOut").value = "";
  });

  window.addEventListener("resize", drawRing);
})();
</script>
</body>
</html>
